<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jong-keon's Tarot Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --gold: #fbc531;
            --deep-purple: #2e1a47;
            --bg-dark: #101025;
        }

        body {
            font-family: 'Nanum Myeongjo', serif;
            background: radial-gradient(circle at center, var(--deep-purple), var(--bg-dark));
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        header { text-align: center; margin-bottom: 40px; }
        h1 { color: var(--gold); font-size: 2.5em; margin: 10px 0; text-shadow: 0 0 15px rgba(251, 197, 49, 0.4); }
        .author { font-size: 0.9em; color: #a29bfe; opacity: 0.8; }

        #tarot-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-bottom: 50px;
            perspective: 1200px;
        }

        .card-wrapper { display: flex; flex-direction: column; align-items: center; }
        .role-title { color: var(--gold); font-weight: bold; margin-bottom: 15px; font-size: 1.2em; }

        .card {
            width: 180px;
            height: 315px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .card.is-flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 3px solid var(--gold);
            box-sizing: border-box;
        }

        .card-back {
            background: #1a0033 url('https://www.transparenttextures.com/patterns/dark-matter.png');
            display: flex; align-items: center; justify-content: center;
            font-size: 4em; color: rgba(251, 197, 49, 0.2);
        }
        .card-back::after { content: "✦"; }

        .card-front {
            background: #fff;
            transform: rotateY(180deg);
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        .card-img {
            flex: 1;
            background-size: cover;
            background-position: center;
            background-color: #f5f5f5;
        }

        .card-name {
            background: #fff; color: #1a1a2e;
            text-align: center; padding: 10px 5px;
            font-size: 0.85em; font-weight: bold;
            border-top: 1px solid var(--gold);
        }

        .controls { display: flex; gap: 15px; margin-bottom: 30px; }

        button {
            padding: 15px 35px;
            background: var(--gold);
            color: #1a1a2e;
            border: none; border-radius: 50px;
            font-size: 1em; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(251, 197, 49, 0.3);
        }

        button:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(251, 197, 49, 0.5); }

        #reading-result {
            max-width: 750px;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px; border-radius: 20px;
            line-height: 2; border: 1px solid rgba(251, 197, 49, 0.2);
            display: none;
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .save-btn { background: #6c5ce7; color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="author">Created by Jong-keon Lee</div>
        <h1>🔮 운명의 타로 마스터</h1>
        <p>오늘 당신에게 흐르는 기운을 확인해보세요.</p>
    </header>

    <div class="controls">
        <button onclick="drawCards()">운명의 카드 뽑기</button>
    </div>

    <div id="tarot-container"></div>

    <div id="reading-result">
        <div id="capture-area">
            <h2 style="color: var(--gold); margin-bottom: 30px;">[ 마스터의 통합 리딩 ]</h2>
            <div id="reading-content"></div>
        </div>
        <button class="save-btn" onclick="saveImage()">리딩 결과 이미지로 저장하기</button>
    </div>

    <script>
        const deck = [];
        const majorKR = ["바보", "마법사", "고위 여사제", "여황제", "황제", "교황", "연인", "전차", "힘", "은둔자", "운명의 수레바퀴", "정의", "매달린 사람", "죽음", "절제", "악마", "탑", "별", "달", "태양", "심판", "세계"];
        const suitNames = [{id:'wa', k:'완드'}, {id:'cu', k:'컵'}, {id:'sw', k:'소드'}, {id:'pe', k:'펜타클'}];

        // 78장 덱 생성
        for(let i=0; i<22; i++) {
            deck.push({
                name: `메이저 ${i}. ${majorKR[i]}`,
                img: `https://sacred-texts.com/tarot/pkt/img/ar${i < 10 ? '0' + i : i}.jpg`
            });
        }
        suitNames.forEach(suit => {
            for(let r=1; r<=14; r++) {
                let rNum = r < 10 ? '0' + r : r;
                deck.push({
                    name: `${suit.k} 카드 ${r}`,
                    img: `https://sacred-texts.com/tarot/pkt/img/${suit.id}${rNum}.jpg`
                });
            }
        });

        let selected = [];

        function drawCards() {
            const container = document.getElementById('tarot-container');
            const resultBox = document.getElementById('reading-result');
            container.innerHTML = '';
            resultBox.style.display = 'none';

            const shuffled = [...deck].sort(() => Math.random() - 0.5);
            selected = shuffled.slice(0, 3).map(c => ({...c, opened: false}));
            
            const roles = ["과거", "현재", "미래"];
            selected.forEach((card, i) => {
                const wrap = document.createElement('div');
                wrap.className = 'card-wrapper';
                wrap.innerHTML = `
                    <div class="role-title">${roles[i]}</div>
                    <div class="card" onclick="flip(this, ${i})">
                        <div class="card-back"></div>
                        <div class="card-front">
                            <div class="card-img" style="background-image: url('${card.img}')"></div>
                            <div class="card-name">${card.name}</div>
                        </div>
                    </div>
                `;
                container.appendChild(wrap);
            });
        }

        function flip(el, idx) {
            if (selected[idx].opened) return;
            el.classList.add('is-flipped');
            selected[idx].opened = true;
            if (selected.every(c => c.opened)) {
                setTimeout(showResult, 800);
            }
        }

        function showResult() {
            const box = document.getElementById('reading-result');
            const content = document.getElementById('reading-content');
            box.style.display = 'block';
            
            content.innerHTML = `
                <p>당신의 흐름은 과거 <strong style="color:var(--gold)">${selected[0].name}</strong>의 영향에서 시작되어,<br>
                현재 <strong style="color:var(--gold)">${selected[1].name}</strong>의 중요한 시기를 지나고 있습니다.</p>
                <p>이 기운은 머지않아 미래의 <strong style="color:var(--gold)">${selected[2].name}</strong>로 이어질 것입니다.</p>
                <p style="margin-top: 30px; font-size: 1.1em; color: #ddd;">
                    "세 장의 카드가 보여주는 길은 명확합니다. 현재의 선택이 곧 찬란한 미래를 완성할 것입니다."
                </p>
            `;
            box.scrollIntoView({ behavior: 'smooth' });
        }

        function saveImage() {
            const area = document.getElementById('capture-area');
            html2canvas(area, { backgroundColor: '#1a1a2e' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-tarot-result.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
